spring.application.name=desafio

# DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/desafio}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.security.jwt.secret=${JWT_SECRET:change-me-in-production-desafio-contas-a-pagar-jwt-secret-key-2026}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.user.username=${AUTH_USERNAME:admin}
app.security.user.password=${AUTH_PASSWORD:admin123}
